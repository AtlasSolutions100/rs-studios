name: Tests (pull requests)

# Runs the test suite on every pull request to main, m1-integration and m1b-integration so a PR shows
# a check before it is merged, again every night (so a new advisory or a date-bound
# test shows up without a push), and by hand. tests/test_app.py chains every test
# file (about 3 minutes). pip-audit checks the locked requirements and fails only on
# High or Critical (tools/audit_gate.py). This workflow never deploys and uses no
# secrets: deploying stays in deploy.yml, which runs only on push to main (and by hand).
on:
  pull_request:
    branches: [main, "m*-integration"]
  schedule:
    - cron: "41 8 * * *"   # 02:41 Central
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: python tests/test_app.py
        env:
          # The tests' data folder is a throwaway; the disk guard (storage.py, default 5 GB
          # free) must not refuse renders on a small runner disk.
          RS_DISK_MIN_GB: "0.2"
        run: python tests/test_app.py

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pip-audit==2.10.1
      - name: pip-audit (fails on High or Critical only)
        run: |
          pip-audit -r requirements.txt --disable-pip --require-hashes --format json -o audit.json --progress-spinner off || true
          python tools/audit_gate.py audit.json
