name: Tests (pull requests)

# Runs the test suite weekly and by hand (once per release is deploy.yml's own run). Before Nov 13 2026 it ran on every PR so a PR showed
# a check before it is merged, again every night (so a new advisory or a date-bound
# test shows up without a push), and by hand. tests/test_app.py chains every test
# file (about 3 minutes). pip-audit checks the locked requirements and fails only on
# High or Critical (tools/audit_gate.py). This workflow never deploys and uses no
# secrets: deploying stays in deploy.yml, which runs only on push to main (and by hand).
on:
  # Once per release (Koby, Nov 13 2026: runner minutes cost money): the suite runs in deploy.yml before anything
  # ships, which is what guards production, so pull requests no longer run it a second and third time (changes are
  # tested locally before they are pushed). Here: weekly, for the date-bound tests and new advisories, and by hand.
  # RUNNER (a repository variable) moves every job to a self-hosted runner, e.g. Koby's Mac mini.
  schedule:
    - cron: "41 8 * * 1"   # Mondays 02:41 Central
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      # ffmpeg: the keyframe-first video tests stitch tiny real clips (tests/test_keyframe_video.py). The runner
      # image has none; without it those checks (and the older watermark and export ones) skip themselves, so a
      # mirror that is down only costs coverage, never the run.
      - name: ffmpeg for the stitching tests
        # Bounded: a mirror that hangs (Nov 11 2026: two runs sat here until the job's own timeout cancelled them)
        # costs coverage too, never the run.
        run: |
          sudo timeout 240 sh -c 'apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq \
            && apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq --no-install-recommends ffmpeg' \
            || echo "no ffmpeg; the stitching checks will be skipped"
      - name: python tests/test_app.py
        env:
          # The tests' data folder is a throwaway; the disk guard (storage.py, default 5 GB
          # free) must not refuse renders on a small runner disk.
          RS_DISK_MIN_GB: "0.2"
        run: python tests/test_app.py

  # The golden path in a real browser with every M2 flag on (tests/golden_path.py, L-12): nightly and by hand
  # only, so pull requests stay fast. Providers and Stripe are faked; nothing leaves the runner.
  golden-path:
    if: github.event_name != 'pull_request'
    # pinned: Playwright 1.56 has no chromium build for the ubuntu 26.04 image that ubuntu-latest now gives
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - run: pip install playwright==1.56.0 && python -m playwright install --with-deps chromium
      - name: golden path, all M2 flags on, axe-core gate (no serious accessibility violations)
        env:
          RS_DISK_MIN_GB: "0.2"
          RS_NEXT_STEPS: "1"
          RS_LAUNCH_KIT: "1"
          RS_SERVICE_PATH: "1"
          RS_PLAN_PAYWALL: "1"
        run: python tests/golden_path.py

  audit:
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pip-audit==2.10.1
      - name: pip-audit (fails on High or Critical only)
        run: |
          pip-audit -r requirements.txt --disable-pip --require-hashes --format json -o audit.json --progress-spinner off || true
          python tools/audit_gate.py audit.json
