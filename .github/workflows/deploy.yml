name: Deploy Campaignify (campaignify.ai)

# Every push to main: run the tests, then hand this commit and the settings
# below to the server's deploy hook (https://campaignify.ai/_deploy).
# No SSH key is involved: the hook accepts a request only with a GitHub-signed
# token proving it comes from this repo's main branch (OIDC, audience
# "rs-deploy"), and it rebuilds only this app.
#
# Settings: add or change a repo secret, then push (or re-run this workflow).
#   HIGGSFIELD_API_KEY     the generation API key ("key:secret")
#   STRIPE_SECRET_KEY      Rector & Stull Stripe key for credit-pack checkout
#                          (a restricted key with Checkout Sessions: write is enough)
#   STRIPE_WEBHOOK_SECRET  signing secret of the https://campaignify.ai/webhooks/stripe
#                          endpoint (Stripe dashboard > Developers > Webhooks)
#   ANTHROPIC_API_KEY      the AI writing key (campaign planner, copy studio, SEO
#                          optimizer); without it those tools show "not set up yet"
#   ANTHROPIC_MODEL        optional repo variable (default claude-sonnet-4-6)
#   GROQ_API_KEY           optional fallback writing key; GROQ_MODEL optional variable
#   STRIPE_PORTAL_CONFIG   optional repo variable: Customer Portal configuration id
#   RS_MARKUP              optional repo variable, default 2.0
#   RS_STARTER_CREDITS     optional repo variable; default = 2 image ads (44 credits)
#   RESEND_API_KEY         email sending for flows (Resend, full access: sending + domains)
#   RESEND_WEBHOOK_SECRET  svix signing secret of https://campaignify.ai/webhooks/resend
#                          (events: email.sent, delivered, bounced, complained, opened, clicked)
#   RS_MAIL_DOMAIN         repo variable: the shared sending subdomain, e.g. mail.campaignify.ai
#   RS_POSTAL_ADDRESS      optional repo variable: Campaignify's own postal address (its notices)
#   TWILIO_ACCOUNT_SID     texting (Scale): the Twilio account (ISV) SID
#   TWILIO_AUTH_TOKEN      its auth token (also validates inbound webhooks)
#   TWILIO_PRIMARY_PROFILE_SID  repo variable: Campaignify's approved primary customer profile (BU…)
#   TWILIO_NOTIFY_EMAIL    optional repo variable: where Twilio sends registration notices
#   RS_HD_MARKUP           optional repo variable: 1080p markup, default 1.4
#   RS_VIDEO_UPSCALE_MODEL / RS_VIDEO_UPSCALE_USD_PER_SECOND  optional variables: switch on upscaling
#   RS_FREE_PREVIEW / RS_FREE_PREVIEWS_PER_DAY               optional variables: the free 480p preview
# A secret or variable that isn't set is simply not sent, so the server keeps
# whatever it already has.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-rs-studios
  cancel-in-progress: false

env:
  HOOK: https://campaignify.ai/_deploy

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tests/test_app.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Package the app and its settings
        env:
          HF_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          STRIPE_PORTAL_CONFIG: ${{ vars.STRIPE_PORTAL_CONFIG }}
          RS_MARKUP: ${{ vars.RS_MARKUP }}
          RS_STARTER_CREDITS: ${{ vars.RS_STARTER_CREDITS }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          RS_MAIL_DOMAIN: ${{ vars.RS_MAIL_DOMAIN }}
          RS_POSTAL_ADDRESS: ${{ vars.RS_POSTAL_ADDRESS }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PRIMARY_PROFILE_SID: ${{ vars.TWILIO_PRIMARY_PROFILE_SID }}
          TWILIO_NOTIFY_EMAIL: ${{ vars.TWILIO_NOTIFY_EMAIL }}
          RS_HD_MARKUP: ${{ vars.RS_HD_MARKUP }}
          RS_VIDEO_UPSCALE_MODEL: ${{ vars.RS_VIDEO_UPSCALE_MODEL }}
          RS_VIDEO_UPSCALE_USD_PER_SECOND: ${{ vars.RS_VIDEO_UPSCALE_USD_PER_SECOND }}
          RS_FREE_PREVIEW: ${{ vars.RS_FREE_PREVIEW }}
          RS_FREE_PREVIEWS_PER_DAY: ${{ vars.RS_FREE_PREVIEWS_PER_DAY }}
        run: |
          git archive --format=tar.gz -o /tmp/app.tgz HEAD
          python3 - <<'PY'
          import base64, json, os
          settings = {k: os.environ[k] for k in ("HF_KEY", "STRIPE_SECRET_KEY", "STRIPE_WEBHOOK_SECRET",
                                             "ANTHROPIC_API_KEY", "ANTHROPIC_MODEL", "GROQ_API_KEY", "GROQ_MODEL",
                                             "STRIPE_PORTAL_CONFIG", "RS_MARKUP", "RS_STARTER_CREDITS",
                                             "RESEND_API_KEY", "RESEND_WEBHOOK_SECRET", "RS_MAIL_DOMAIN", "RS_POSTAL_ADDRESS",
                                             "RS_HD_MARKUP", "RS_VIDEO_UPSCALE_MODEL", "RS_VIDEO_UPSCALE_USD_PER_SECOND",
                                             "RS_FREE_PREVIEW", "RS_FREE_PREVIEWS_PER_DAY", "TWILIO_ACCOUNT_SID",
                                             "TWILIO_AUTH_TOKEN", "TWILIO_PRIMARY_PROFILE_SID", "TWILIO_NOTIFY_EMAIL")
                      if os.environ.get(k)}
          print("settings sent:", ", ".join(settings) or "none")
          body = {"commit": os.environ["GITHUB_SHA"], "settings": settings,
                  "archive": base64.b64encode(open("/tmp/app.tgz", "rb").read()).decode()}
          json.dump(body, open("/tmp/deploy.json", "w"))
          PY
          ls -la /tmp/app.tgz

      - name: Send to the server
        run: |
          token() { curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rs-deploy" | jq -r .value; }
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 120 -X POST "$HOOK" \
                     -H "Authorization: Bearer $(token)" -H "Content-Type: application/json" \
                     --data-binary @/tmp/deploy.json) || code=000
            echo "attempt $i: HTTP $code"; cat /tmp/resp.json 2>/dev/null; echo
            [ "$code" = "202" ] && break
            [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "400" ] && exit 1
            sleep 15
          done
          [ "$code" = "202" ] || exit 1
          echo "JOB=$(jq -r .job /tmp/resp.json)" >> "$GITHUB_ENV"

      - name: Wait for the build
        run: |
          for i in $(seq 1 120); do
            s=$(curl -fsS --max-time 20 "$HOOK/$JOB" || echo '{"status":"unknown"}')
            st=$(echo "$s" | jq -r .status)
            if [ "$st" = "done" ] || [ "$st" = "failed" ]; then
              echo "$s" | jq -r '.log'; echo "status: $st"
              [ "$st" = "done" ] && exit 0 || exit 1
            fi
            sleep 10
          done
          echo "deploy did not finish in 20 minutes"; exit 1

      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if curl -fsS --max-time 20 "https://campaignify.ai/health?deep=1"; then echo; exit 0; fi
            sleep 6
          done
          exit 1
