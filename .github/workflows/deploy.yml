          TIKTOK_ADS: ${{ vars.TIKTOK_ADS }}
          TIKTOK_APP_ID: ${{ vars.TIKTOK_APP_ID }}
          TIKTOK_APP_SECRET: ${{ secrets.TIKTOK_APP_SECRET }}
          # Conversion tracking on members' pages (conversions.py, M3.4/M3.5): off until CONVERSIONS_API is set.
          CONVERSIONS_API: ${{ vars.CONVERSIONS_API }}
          META_CAPI_USE_CONNECTION_TOKEN: ${{ vars.META_CAPI_USE_CONNECTION_TOKEN }}
          # Kill switches and opt-ins (repo variables; see the list at the top). Unset = not sent.
          BILLING_HOLD: ${{ vars.BILLING_HOLD }}
          CREDIT_HOLDS: ${{ vars.CREDIT_HOLDS }}
          PLAN_PENDING: ${{ vars.PLAN_PENDING }}
          RENEWAL_PAUSE: ${{ vars.RENEWAL_PAUSE }}
          HF_RETRY: ${{ vars.HF_RETRY }}
          RS_LOGIN_HARDENING: ${{ vars.RS_LOGIN_HARDENING }}
          RS_SIGNUP_CONFIRM: ${{ vars.RS_SIGNUP_CONFIRM }}
          RS_NEXT_STEPS: ${{ vars.RS_NEXT_STEPS }}
          RS_STORAGE_QUOTAS: ${{ vars.RS_STORAGE_QUOTAS }}
          RS_JOB_CANCEL: ${{ vars.RS_JOB_CANCEL }}
          RS_CARD_REQUIRED: ${{ vars.RS_CARD_REQUIRED }}
          RS_PLAN_PAYWALL: ${{ vars.RS_PLAN_PAYWALL }}
          PLANS_ONLY: ${{ vars.PLANS_ONLY || '1' }}
          PLAN_SALE: ${{ vars.PLAN_SALE || '1' }}
          DONE_FOR_YOU_EMAIL: ${{ vars.DONE_FOR_YOU_EMAIL }}
          RS_CARD_STARTS_PER_HOUR: ${{ vars.RS_CARD_STARTS_PER_HOUR }}
          RS_STORAGE_PURGE_DELETED: ${{ vars.RS_STORAGE_PURGE_DELETED }}
          RS_SERVICE_PATH: ${{ vars.RS_SERVICE_PATH }}
          RS_LAUNCH_KIT: ${{ vars.RS_LAUNCH_KIT }}
          UI_V2: ${{ vars.UI_V2 }}
          # HOME_V2 (ui_v2.force): the public home page in the new look for everyone, whatever UI_V2 says.
          # On unless the repository variable HOME_V2 is 0.
          HOME_V2: ${{ vars.HOME_V2 || '1' }}
          # HOOK_TOOL (hooktool.py): the free hook generator on the public site. On unless 0.
          # HOOK_TOOL_DAILY_MAX: runs a day for the whole site (default 300).
          HOOK_TOOL: ${{ vars.HOOK_TOOL }}
          HOOK_TOOL_DAILY_MAX: ${{ vars.HOOK_TOOL_DAILY_MAX }}
          TEXT_LAYERS: ${{ vars.TEXT_LAYERS }}
          CLAIMS_CHECK: ${{ vars.CLAIMS_CHECK }}
          IMAGE_QA: ${{ vars.IMAGE_QA }}
          IMAGE_QA_DAILY_MAX: ${{ vars.IMAGE_QA_DAILY_MAX }}
          IMAGE_QA_MODEL: ${{ vars.IMAGE_QA_MODEL }}
          FREE_FIX: ${{ vars.FREE_FIX }}
          FREE_FIX_MONTHLY_CAP: ${{ vars.FREE_FIX_MONTHLY_CAP }}
          PRESENTER_STILLS: ${{ vars.PRESENTER_STILLS }}
          PRESENTER_VOICE_REF: ${{ vars.PRESENTER_VOICE_REF }}
          PRESENTER_ANGLES: ${{ vars.PRESENTER_ANGLES }}
          LIB_STORE: ${{ vars.LIB_STORE }}
          CLAIMS_CHECK_DAILY_MAX: ${{ vars.CLAIMS_CHECK_DAILY_MAX }}
          CLAIMS_CHECK_WS_DAILY_MAX: ${{ vars.CLAIMS_CHECK_WS_DAILY_MAX }}
          RS_LIBRARY_STILL_MODEL: ${{ vars.RS_LIBRARY_STILL_MODEL }}
          RS_LIBRARY_STILL_USD: ${{ vars.RS_LIBRARY_STILL_USD }}
          KEYFRAME_VIDEO: ${{ vars.KEYFRAME_VIDEO }}
          VIDEO_QA: ${{ vars.VIDEO_QA }}
          VIDEO_QA_DAILY_MAX: ${{ vars.VIDEO_QA_DAILY_MAX }}
          FREE_FIX_VIDEO_MONTHLY_CAP: ${{ vars.FREE_FIX_VIDEO_MONTHLY_CAP }}
          OPS_ALERTS: ${{ vars.OPS_ALERTS }}
          BACKUPS: ${{ vars.BACKUPS }}
          BACKUP_MEDIA: ${{ vars.BACKUP_MEDIA }}
          RS_DISK_MIN_GB: ${{ vars.RS_DISK_MIN_GB }}
          RS_HEALTH_WORKER_MAX_AGE: ${{ vars.RS_HEALTH_WORKER_MAX_AGE }}
          RS_WORKER_PROCESS: ${{ vars.RS_WORKER_PROCESS }}
          RS_TASK_THREADS: ${{ vars.RS_TASK_THREADS }}
          RS_HEALTH_BUSY_MAX_S: ${{ vars.RS_HEALTH_BUSY_MAX_S }}
        run: |
          git archive --format=tar.gz -o /tmp/app.tgz HEAD
          python3 - <<'PY'
          import base64, json, os
          settings = {k: os.environ[k] for k in ("HF_KEY", "STRIPE_SECRET_KEY", "STRIPE_WEBHOOK_SECRET",
                                             "ANTHROPIC_API_KEY", "ANTHROPIC_MODEL", "GROQ_API_KEY", "GROQ_MODEL",
                                             "STRIPE_PORTAL_CONFIG", "RS_MARKUP", "RS_STARTER_CREDITS",
                                             # live ids (liveids.py, M7.4) and owner setup links (SEC-9)
                                             "STRIPE_PLAN_PRICE_STARTER", "STRIPE_PLAN_PRICE_GROWTH",
                                             "STRIPE_PLAN_PRICE_SCALE", "STRIPE_PLAN_PRODUCT_STARTER",
                                             "STRIPE_PLAN_PRODUCT_GROWTH", "STRIPE_PLAN_PRODUCT_SCALE",
                                             "STRIPE_PRICE_STARTER", "STRIPE_PRICE_PRO", "STRIPE_PRICE_STUDIO",
                                             "TWILIO_SECONDARY_POLICY_SID", "TWILIO_A2P_POLICY_SID", "INDEXNOW_KEY",
                                             "RS_LIVE_IDS", "STRIPE_SETUP", "RS_OWNER_INVITES",
                                             "SIGNUP_CREDITS_ADS", "SIGNUP_CREDITS_ADS_PER_DAY",
                                             "RESEND_API_KEY", "RESEND_WEBHOOK_SECRET", "RS_MAIL_DOMAIN", "RS_POSTAL_ADDRESS",
                                             "RS_HD_MARKUP", "RS_VIDEO_UPSCALE_MODEL", "RS_VIDEO_UPSCALE_USD_PER_SECOND",
                                             "RS_FREE_PREVIEW", "RS_FREE_PREVIEWS_PER_DAY", "RS_EMAIL_VERIFY",
                                             "RS_ACCOUNT_MAIL_FROM", "RS_OUTREACH_FROM", "FIRST_RUN_NUDGES",
                                             "EMAIL_DAILY_LIMIT", "EMAIL_TRANSACTIONAL_RESERVE", "EMAIL_NURTURE_DAILY_MAX",
                                             "GOOGLE_OAUTH_CLIENT_ID", "GOOGLE_OAUTH_CLIENT_SECRET", "TWILIO_ACCOUNT_SID",
                                             "TWILIO_AUTH_TOKEN", "TWILIO_PRIMARY_PROFILE_SID", "TWILIO_NOTIFY_EMAIL",
                                             "GADS_SIGNUP_LABEL", "GADS_PURCHASE_LABEL", "GADS_TAG_ID",
                                             "META_PIXEL_ID", "TIKTOK_PIXEL_ID", "REDDIT_PIXEL_ID", "X_PIXEL_ID",
                                             "X_EVENT_SIGNUP", "X_EVENT_PURCHASE", "X_EVENT_VIEWCONTENT",
                                             "META_CAPI_TOKEN", "TIKTOK_EVENTS_TOKEN", "REDDIT_CAPI_TOKEN",
                                             "META_TEST_EVENT_CODE", "TIKTOK_TEST_EVENT_CODE",
                                             "POOLS_PARTNER_SECRET", "CREATOR_POOLS", "CREATOR_POOL_FEE_USD",
                                             "CREATOR_POOL_MIN_USD", "CREATOR_POOL_MAX_USD", "CROWDCUT_URL",
                                             "MCP_SERVER", "MCP_ALLOWED_ORIGINS", "OPS_ALERT_EMAIL",
                                             "R2_ACCOUNT_ID", "R2_ACCESS_KEY_ID", "R2_SECRET_ACCESS_KEY", "R2_BUCKET",
                                             "BACKUP_CRYPT_PASSWORD", "BACKUP_CRYPT_SALT",
                                             "AD_LAUNCH", "AD_LAUNCH_WORKSPACES", "AD_RATE_TIER", "META_APP_ID",
                                             "META_APP_SECRET", "META_LOGIN_CONFIG_ID", "TOKEN_KEY", "TOKEN_KEYS_OLD",
                                             "GOOGLE_ADS", "GOOGLE_ADS_CLIENT_ID", "GOOGLE_ADS_CLIENT_SECRET",
                                             "SNAPCHAT_ADS", "SNAPCHAT_CLIENT_ID", "SNAPCHAT_CLIENT_SECRET",
                                             "TIKTOK_ADS", "TIKTOK_APP_ID", "TIKTOK_APP_SECRET",
                                             "CONVERSIONS_API", "META_CAPI_USE_CONNECTION_TOKEN",
                                             # kill switches and opt-ins (N15)
                                             "BILLING_HOLD", "CREDIT_HOLDS", "PLAN_PENDING", "RENEWAL_PAUSE", "HF_RETRY",
                                             "RS_LOGIN_HARDENING", "RS_SIGNUP_CONFIRM", "RS_NEXT_STEPS", "RS_STORAGE_QUOTAS",
                                             "RS_JOB_CANCEL", "RS_STORAGE_PURGE_DELETED", "RS_SERVICE_PATH", "OPS_ALERTS", "BACKUPS",
                                             "RS_CARD_REQUIRED", "RS_PLAN_PAYWALL", "RS_CARD_STARTS_PER_HOUR", "PLANS_ONLY", "PLAN_SALE",
                                             "DONE_FOR_YOU_EMAIL",
                                             "BACKUP_MEDIA", "RS_DISK_MIN_GB", "RS_HEALTH_WORKER_MAX_AGE", "RS_LAUNCH_KIT", "UI_V2", "HOME_V2", "HOOK_TOOL", "HOOK_TOOL_DAILY_MAX",
                                             "TEXT_LAYERS", "CLAIMS_CHECK", "IMAGE_QA", "IMAGE_QA_DAILY_MAX", "IMAGE_QA_MODEL", "FREE_FIX",
                                             "FREE_FIX_MONTHLY_CAP",
                                             "PRESENTER_STILLS", "PRESENTER_VOICE_REF", "PRESENTER_ANGLES", "LIB_STORE", "CLAIMS_CHECK_DAILY_MAX",
                                             "CLAIMS_CHECK_WS_DAILY_MAX", "RS_LIBRARY_STILL_MODEL", "RS_LIBRARY_STILL_USD",
                                             "KEYFRAME_VIDEO", "VIDEO_QA", "VIDEO_QA_DAILY_MAX", "FREE_FIX_VIDEO_MONTHLY_CAP",
                                             "RS_WORKER_PROCESS", "RS_TASK_THREADS",
                                             "RS_HEALTH_BUSY_MAX_S")
                      if os.environ.get(k)}
          print("settings sent:", ", ".join(settings) or "none")
          body = {"commit": os.environ["GITHUB_SHA"], "settings": settings,
                  "archive": base64.b64encode(open("/tmp/app.tgz", "rb").read()).decode()}
          json.dump(body, open("/tmp/deploy.json", "w"))
          PY
          ls -la /tmp/app.tgz

      - name: Send to the server
        run: |
          token() { curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                      "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rs-deploy" | jq -r .value; }
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/resp.json -w '%{http_code}' --max-time 120 -X POST "$HOOK" \
                     -H "Authorization: Bearer $(token)" -H "Content-Type: application/json" \
                     --data-binary @/tmp/deploy.json) || code=000
            echo "attempt $i: HTTP $code"; cat /tmp/resp.json 2>/dev/null; echo
            [ "$code" = "202" ] && break
            [ "$code" = "401" ] || [ "$code" = "403" ] || [ "$code" = "400" ] && exit 1
            sleep 15
          done
          [ "$code" = "202" ] || exit 1
          echo "JOB=$(jq -r .job /tmp/resp.json)" >> "$GITHUB_ENV"

      # The job log shows the build, the health check of the new image beside the live
      # one ("health check before the switch"), the image kept as :prev, the switch
      # and the check after it. "failed" with "were not touched" = the old release
      # is still serving; "rolled back to ..." = it switched, was unhealthy, and went back.
      - name: Wait for the build
        run: |
          for i in $(seq 1 120); do
            s=$(curl -fsS --max-time 20 "$HOOK/$JOB" || echo '{"status":"unknown"}')
            st=$(echo "$s" | jq -r .status)
            if [ "$st" = "done" ] || [ "$st" = "failed" ]; then
              echo "$s" | jq -r '.log'; echo "status: $st"
              [ "$st" = "done" ] && exit 0 || exit 1
            fi
            sleep 10
          done
          echo "deploy did not finish in 20 minutes"; exit 1

      # 200 means the database answers and the background loop beats: with the worker in its own container
      # (M7.2) that is this release's worker (same BUILD_ID), not the old one's last beat.
      - name: Health check
        run: |
          for i in $(seq 1 20); do
            if body=$(curl -fsS --max-time 20 "https://campaignify.ai/health?deep=1"); then
              echo "$body"
              echo "$body" | jq -r '"worker: " + (.checks.worker.status // "?") + ", mode " + (.checks.worker.mode // "thread")
                + ", build " + (.checks.worker.build // "none") + ", worker code " + (.checks.worker_code // "?")'
              exit 0
            fi
            sleep 6
          done
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ping IndexNow with the sitemap
        # Tells Bing and the other IndexNow engines about the public pages right after a deploy.
        # The key is public (public_site.INDEXNOW_KEY, served at /<key>.txt). A failed ping doesn't fail the deploy.
        continue-on-error: true
        run: |
          pip install -q markupsafe
          python indexnow.py
