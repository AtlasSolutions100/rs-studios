name: Deploy Campaignify (campaignify.ai)

# Every push to main: run the tests and pip-audit, then hand this commit and the
# settings below to the server's deploy hook (https://campaignify.ai/_deploy).
# No SSH key is involved: the hook accepts a request only with a GitHub-signed
# token proving it comes from this repo's main branch (OIDC, audience
# "rs-deploy"), and it rebuilds only this app.
# The hook (clipforgd deploy/deployer/deployer.py) builds the new image, starts it
# beside the live one and waits for /health before switching; a build that fails
# that check leaves the live container serving and fails this run. After the
# switch it checks /health again and goes back to the previous image on its own.
# To roll back by hand: Actions > "Roll back Campaignify" (rollback.yml).
#
# Settings: add or change a repo secret, then push (or re-run this workflow).
#   HIGGSFIELD_API_KEY     the generation API key ("key:secret")
#   STRIPE_SECRET_KEY      Rector & Stull Stripe key for credit-pack checkout
#                          (a restricted key with Checkout Sessions: write is enough)
#   STRIPE_WEBHOOK_SECRET  signing secret of the https://campaignify.ai/webhooks/stripe
#                          endpoint (Stripe dashboard > Developers > Webhooks)
#   ANTHROPIC_API_KEY      the AI writing key (campaign planner, copy studio, SEO
#                          optimizer, competitor research with web search); without it those tools show "not set up yet"
#   ANTHROPIC_MODEL        optional repo variable (default claude-sonnet-4-6)
#   GROQ_API_KEY           optional fallback writing key; GROQ_MODEL optional variable
#   STRIPE_PORTAL_CONFIG   optional repo variable: Customer Portal configuration id
#   Live ids (liveids.py, roadmap M7.4): each optional repo variable overrides today's production value, which
#   liveids.PRODUCTION keeps as the fallback. STRIPE_PLAN_PRICE_STARTER/_GROWTH/_SCALE,
#   STRIPE_PLAN_PRODUCT_STARTER/_GROWTH/_SCALE, STRIPE_PRICE_STARTER/_PRO/_STUDIO (credit packs),
#   TWILIO_SECONDARY_POLICY_SID, TWILIO_A2P_POLICY_SID, INDEXNOW_KEY (plus STRIPE_PORTAL_CONFIG, GADS_TAG_ID,
#   GOOGLE_OAUTH_CLIENT_ID, RS_POSTAL_ADDRESS listed here). RS_LIVE_IDS=settings drops the fallback (a staging copy).
#   RS_OWNER_INVITES       optional secret: owner setup links, "email:sha256-of-code,..." (SEC-9: no owner email or
#                          code hash in the source any more; unset = no owner setup links)
#   RS_MARKUP              optional repo variable, default 2.0
#   RS_STARTER_CREDITS     optional repo variable; default = 2 image ads (44 credits)
#   SIGNUP_CREDITS_ADS     optional repo variable: starter credits for sign-ups whose first touch is a paid ad
#                          (utm_medium cpc/paid*, or gclid/fbclid/ttclid/rdt_cid/twclid); default 500 when
#                          unset, "0" or "off" gives everyone RS_STARTER_CREDITS (adoffer.py)
#   SIGNUP_CREDITS_ADS_PER_DAY  optional repo variable: most ad-offer grants a day (default 200)
#   RESEND_API_KEY         email sending for flows (Resend, full access: sending + domains)
#   RESEND_WEBHOOK_SECRET  svix signing secret of https://campaignify.ai/webhooks/resend
#                          (events: email.sent, delivered, bounced, complained, opened, clicked)
#   RS_MAIL_DOMAIN         repo variable: the shared sending subdomain, e.g. mail.campaignify.ai
#   RS_POSTAL_ADDRESS      optional repo variable: Campaignify's own postal address (its notices)
#   TWILIO_ACCOUNT_SID     texting (Scale): the Twilio account (ISV) SID (TWILIO_SID also works)
#   TWILIO_AUTH_TOKEN      its auth token (also validates inbound webhooks)
#   TWILIO_PRIMARY_PROFILE_SID  repo variable: Campaignify's approved primary customer profile (BU…)
#   TWILIO_NOTIFY_EMAIL    optional repo variable: where Twilio sends registration notices
#   RS_HD_MARKUP           optional repo variable: 1080p markup, default 1.4
#   RS_VIDEO_UPSCALE_MODEL / RS_VIDEO_UPSCALE_USD_PER_SECOND  optional variables: switch on upscaling
#   RS_FREE_PREVIEW / RS_FREE_PREVIEWS_PER_DAY               optional variables: the free 480p preview (cap default 30/day)
#   RS_EMAIL_VERIFY / RS_ACCOUNT_MAIL_FROM                  optional variables: confirm-your-email (0 switches it off;
#                          unset or 1: everyone confirms while PLANS_ONLY is on, free accounts only otherwise; all:
#                          everyone, always; video: free accounts only) and its From (default "Campaignify"
#                          <no-reply@RS_MAIL_DOMAIN>)
#   FIRST_RUN_NUDGES       optional variable: "0" switches off the "your free ads are waiting" emails (nudges.py)
#   EMAIL_DAILY_LIMIT / EMAIL_TRANSACTIONAL_RESERVE / EMAIL_NURTURE_DAILY_MAX  optional variables: the email
#                          budget (mailer.py; defaults 100, 30, 60). Nurture stops at its cap or once today's
#                          sends reach the limit minus the reserve; EMAIL_DAILY_LIMIT=0 means no daily limit.
#   GOOGLE_OAUTH_CLIENT_SECRET  Continue with Google (google_auth.py): the OAuth client secret of the Campaignify
#                          web app in Google Cloud. The button shows only once this is set.
#   GOOGLE_OAUTH_CLIENT_ID optional variable: that client's id (public). Unset, the app uses
#                          google_auth.DEFAULT_CLIENT_ID. The authorized redirect URI in Google Cloud must be
#                          https://campaignify.ai/auth/google/callback.
#   RS_OUTREACH_FROM       optional variable: the From of admin outreach emails (/admin/outreach),
#                          default "Koby Stull" <hello@RS_MAIL_DOMAIN>; replies go to hello@ its domain
#   GADS_SIGNUP_LABEL      optional variable: Google Ads conversion label for sign_up (not a secret; it's
#                          in every page's HTML once set). Unset: the tag loads but this conversion doesn't fire
#   GADS_PURCHASE_LABEL    optional variable: Google Ads conversion label for purchase (plans and packs)
#   GADS_TAG_ID            optional variable: another Google tag id (default AW-18543041154)
#   Ad pixels (pixels.py; repo variables, not secrets: pixel ids are public, they're in every page's HTML).
#   Each pixel loads only once its variable is set; "off" switches one off again.
#   META_PIXEL_ID          Meta Events Manager > the dataset (pixel) id
#   TIKTOK_PIXEL_ID        TikTok Ads Manager > Assets > Events > Web events > the pixel code
#   REDDIT_PIXEL_ID        Reddit Ads > Events Manager > the pixel id (a2_... / t2_...)
#   X_PIXEL_ID             X Ads > Tools > Events manager > the base pixel id
#   X_EVENT_SIGNUP / X_EVENT_PURCHASE / X_EVENT_VIEWCONTENT   X event ids (tw-<pixel>-<event>) of the
#                          conversion events made in X Ads; an X event without its id isn't sent
#   Server-side copies (conversions.py, optional secrets; a platform is skipped until its token is set):
#   META_CAPI_TOKEN        Meta Conversions API access token (dataset > Settings)
#   TIKTOK_EVENTS_TOKEN    TikTok Events API access token (pixel > Settings)
#   REDDIT_CAPI_TOKEN      Reddit Conversions API access token
#   META_TEST_EVENT_CODE / TIKTOK_TEST_EVENT_CODE   optional variables: send server events to the test tools
#   Creator Pools (creator_pools.py): brands fund pools that Crowdcut clippers earn from.
#   POOLS_PARTNER_SECRET   secret shared with the clipforgd repo (same value in both): signs the
#                          server-to-server calls. Unset: pools can't be paid for or go live
#   CREATOR_POOLS          optional variable: "on" shows Creator Pools to every workspace; default
#                          "off" = admins and the operator's own workspaces only
#   CREATOR_POOL_FEE_USD   optional variable: the flat fee per campaign (default 99)
#   CREATOR_POOL_MIN_USD   optional variable: the smallest pool (default 200)
#   CREATOR_POOL_MAX_USD   optional variable: the largest pool (default 10000)
#   CROWDCUT_URL           optional variable, default https://crowdcut.studio
#   Off-site backups (backup.py; README "Backups and the restore drill"). Nightly, encrypted with
#   rclone crypt, to one Cloudflare R2 bucket under campaignify/. All six or nothing is uploaded:
#   R2_ACCOUNT_ID          the Cloudflare account id (R2 > Overview, right side)
#   R2_ACCESS_KEY_ID       the R2 API token's Access Key ID (token scoped to that one bucket)
#   R2_SECRET_ACCESS_KEY   that token's Secret Access Key
#   R2_BUCKET              the bucket name
#   BACKUP_CRYPT_PASSWORD  the encryption password: a long random string. Keep a copy outside GitHub:
#   BACKUP_CRYPT_SALT      a second long random string. Without both, the backups can't be read.
#   Connected ad accounts (adconnect_routes.py, adplatforms/, roadmap M2). Nothing shows until AD_LAUNCH is set:
#   AD_LAUNCH              optional variable: off (default) | beta | on
#   AD_LAUNCH_WORKSPACES   optional variable: workspace ids that see it while AD_LAUNCH=beta, comma separated
#   AD_RATE_TIER           optional variable: limited (default) | full, once Meta grants Full access
#   META_APP_ID            the Meta app id (secret or variable)
#   META_APP_SECRET        the Meta app secret
#   META_LOGIN_CONFIG_ID   the Facebook Login for Business configuration id (secret or variable)
#   TOKEN_KEY              the token box key: 32 random bytes, base64 (secretsbox.py). Keep a copy outside
#                          GitHub: without it no stored ad-account token can be read
#   GOOGLE_ADS             optional variable: 1 turns Google Ads connect and launch on (adplatforms/google.py,
#                          roadmap M3), on top of AD_LAUNCH. Default off
#   GOOGLE_ADS_CLIENT_ID   optional variable: the OAuth client for Google Ads; unset = GOOGLE_OAUTH_CLIENT_ID. Its Cloud
#                          project must have the Google Ads API on (Basic access) and list the redirect URI
#                          https://campaignify.ai/connect/google/callback. No developer token: Google retired them
#                          on 2026-09-09; access follows the Cloud project
#   GOOGLE_ADS_CLIENT_SECRET optional secret: that client's secret; unset = GOOGLE_OAUTH_CLIENT_SECRET
#   SNAPCHAT_ADS           optional variable: 1 turns Snapchat connect and launch on (adplatforms/snapchat.py,
#                          roadmap M6.1), on top of AD_LAUNCH. Default off
#   SNAPCHAT_CLIENT_ID     variable: the Snapchat Marketing API OAuth app's client id (Business Manager > Business
#                          Details > OAuth Apps). Its redirect URI must be https://campaignify.ai/connect/snapchat/callback
#   SNAPCHAT_CLIENT_SECRET secret: that OAuth app's client secret (Snap shows it once)
#   TIKTOK_ADS             optional variable: 1 turns TikTok connect and launch on (adplatforms/tiktok.py, roadmap
#                          M6.2), on top of AD_LAUNCH. Default off
#   TIKTOK_APP_ID          variable: the TikTok for Business developer app's App ID (business-api.tiktok.com > My Apps).
#                          Its Advertiser redirect URL must be https://campaignify.ai/connect/tiktok/callback
#   TIKTOK_APP_SECRET      secret: that app's Secret
#   CONVERSIONS_API        optional variable: 1 turns conversion tracking on members' Campaignify pages and forms
#                          on (conversions.py, roadmap M3.4): browser pixels and server events with one event id
#                          to the workspace's Meta pixel (Conversions API), TikTok pixel (Events API) and Google Ads
#                          (Data Manager API, leads). On top of AD_LAUNCH. Default off
#   META_CAPI_USE_CONNECTION_TOKEN optional variable: 1 lets a Meta pixel without its own Conversions API token use
#                          the Meta connection's token. Set it only after tools/conversions_check.py shows Meta takes it
#   TOKEN_KEYS_OLD         only while rotating TOKEN_KEY: the previous key(s), comma separated, still read.
#                          To rotate: (1) set TOKEN_KEYS_OLD to the current TOKEN_KEY, (2) set TOKEN_KEY to a new
#                          key, (3) deploy, (4) on the server run `python3 secretsbox.py rotate` in the app
#                          container (re-seals every token box under the new key), (5) set TOKEN_KEYS_OLD to
#                          "none" and deploy again (deleting it only stops sending it; the server keeps the
#                          last value). Skipping step 1 makes every stored token unreadable (Reconnect).
#   Kill switches and opt-ins (repo variables, N15). "0" turns one off and "1" turns it on, for each of them;
#   unset, the app's default applies. To undo one, set it back ("1" or "0"): deleting the variable stops
#   sending it, and the server keeps the last value it was sent.
#   BILLING_HOLD           refunds and disputes pause the workspace (billing_holds.py), default on
#   CREDIT_HOLDS           AI runs reserve their credits first (credits.py), default on
#   PLAN_PENDING           a plan starts only once its first invoice is paid (plans.py), default on
#   RENEWAL_PAUSE          a failed renewal stops generation (plans.py), default on
#   HF_RETRY               retry the generation vendor on timeouts, 429 and 5xx (hf.py), default on
#   RS_LOGIN_HARDENING     login, sign-up and reset hardening (login_security.py), default on
#   RS_SIGNUP_CONFIRM      a form sign-up logs in first from its emailed link (login_security.py), default off; set 1 to turn on
#   RS_NEXT_STEPS          the "Your campaign" step strip on Home and the new upgrade-wall copy (next_steps.py), default off
#   RS_STORAGE_QUOTAS      storage quotas per plan (storage.py), default on
#   RS_JOB_CANCEL          the member Cancel button on queued ads (jobs_routes.py), default off
#   RS_CARD_REQUIRED       card on file at sign-up, never charged (card_on_file.py), default off; set 1 to turn on
#   RS_PLAN_PAYWALL        out-of-credits free plan and lock (plan_paywall.py), default off; set 1 to turn on
#   PLANS_ONLY             no free tier (plan_gate.py): a sign-up picks a plan with a card, Starter and Growth start with a
#                          3-day trial, Scale is charged at once, packs top up a plan. On here unless the variable says 0
#   PLAN_SALE              show each plan's price next to the price it is going to, struck through, with the percent off
#                          (plans.sale). Display only. On here unless the variable says 0
#   DONE_FOR_YOU_EMAIL     who gets a done-for-you request (tools_page.py), as an address or "Name <address>". No
#                          default here or in the code (no owner address in the source); unset, requests go to the
#                          site's contact address
#   RS_CARD_STARTS_PER_HOUR  optional variable: card checkouts the whole app may start per hour (card-testing
#                          guard, card_on_file.py), default 300
#   RS_STORAGE_PURGE_DELETED  remove files of ads deleted over 30 days ago (storage.py), default off
#   RS_SERVICE_PATH        the service-business first run, website import, keyword list and lead steps (service_path.py), default off
#   RS_LAUNCH_KIT          the launch kit on the plan page, ticks saved to the workspace (launch_kit.py), default off
#   UI_V2                  the neutral look, the Studio composer and the onboarding steps for everyone (ui_v2.py),
#                          default off; a site admin can preview it alone with ?ui=v2 or Settings > Team
#   Quality wave 2 (optional variables; costs are in settings.example.txt):
#   TEXT_LAYERS            image presets whose words are set as real type (textlayer.py), default on; "0" hides them
#   CLAIMS_CHECK           the claims check before Generate (claims_check.py), default off
#   IMAGE_QA               automatic check of finished images, silent retry, refund (image_qa.py), default off;
#                          IMAGE_QA_DAILY_MAX (default 2000) and IMAGE_QA_MODEL are its settings. Off or on, the
#                          text-free picture of a static with a text layer is always checked for painted-in words
#   FREE_FIX               one free fix per delivered image (free_fix.py), default off; FREE_FIX_MONTHLY_CAP (default 10)
#   m15 library (optional variables; README "m15 library"):
#   PRESENTER_STILLS       a presenter's approved situation still is the video model's first reference image
#                          (presenters.py, worker.py), default off
#   PRESENTER_VOICE_REF    a presenter's voice sample is sent as the audio reference, default off (needs a paid test first)
#   LIB_STORE              gallery clips kept outside this bundle (libstore.py): the server fetches them from the repo's
#                          own tree at the commit the manifest pins and checks each by SHA-256. On by default; 0 = off
#   PRESENTER_ANGLES       with PRESENTER_STILLS: a presenter's look-lock pictures (the same person from three sides)
#                          follow the still as reference images, default off (needs a paid test first)
#   CLAIMS_CHECK_DAILY_MAX / CLAIMS_CHECK_WS_DAILY_MAX   the free claims check's daily caps (defaults 3000 and 150)
#   RS_LIBRARY_STILL_MODEL / RS_LIBRARY_STILL_USD        the admin library's own image model and our estimate of its price
#   KEYFRAME_VIDEO         videos made from a recipe are built from one approved still, in beats, and stitched
#                          (keyframe_video.py; README "Keyframe-first video"), default off. Run the paid test first
#                          (/admin/library, kind keyframe_tests)
#   VIDEO_QA               three frames of every beat are checked; a failing beat is made again once, default off;
#                          VIDEO_QA_DAILY_MAX (default 3000) caps the keyframe and frame checks a day
#   FREE_FIX_VIDEO_MONTHLY_CAP  with FREE_FIX on: one-beat video fixes a workspace a month (default 2)
#   OPS_ALERTS             operator alert emails (alerts.py), default on
#   BACKUPS / BACKUP_MEDIA the nightly off-site backup, and its media folders (backup.py), default on
#   RS_DISK_MIN_GB         uploads and new files are refused below this much free disk (storage.py), default 5
#   RS_WORKER_PROCESS      optional variable, the M7.2 kill switch: "off" puts the background loop back in the app
#                          container as a thread (the worker container then idles). Default on: docker-compose runs
#                          the loop in its own "worker" service (worker_main.py) and the web only serves requests.
#   RS_TASK_THREADS        optional variable: planning and research runs the worker runs at once (default 4)
#   RS_HEALTH_WORKER_MAX_AGE / RS_HEALTH_BUSY_MAX_S   /health worker heartbeat limits in seconds (alerts.py),
#                          default 180 and 900; keep the first over 120 (the deploy hook's wait after the switch)
# A secret or variable that isn't set is simply not sent, so the server keeps
# whatever it already has.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-rs-studios
  cancel-in-progress: false

env:
  HOOK: https://campaignify.ai/_deploy

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --require-hashes -r requirements.txt
      - name: pip-audit (fails on High or Critical only)
        run: |
          pip install --quiet pip-audit==2.10.1
          pip-audit -r requirements.txt --disable-pip --require-hashes --format json -o audit.json --progress-spinner off || true
          python tools/audit_gate.py audit.json
      - name: python tests/test_app.py
        env:
          RS_DISK_MIN_GB: "0.2"
        run: python tests/test_app.py

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Package the app and its settings
        env:
          HF_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          STRIPE_PORTAL_CONFIG: ${{ vars.STRIPE_PORTAL_CONFIG }}
          STRIPE_PLAN_PRICE_STARTER: ${{ vars.STRIPE_PLAN_PRICE_STARTER }}
          STRIPE_PLAN_PRICE_GROWTH: ${{ vars.STRIPE_PLAN_PRICE_GROWTH }}
          STRIPE_PLAN_PRICE_SCALE: ${{ vars.STRIPE_PLAN_PRICE_SCALE }}
          STRIPE_PLAN_PRODUCT_STARTER: ${{ vars.STRIPE_PLAN_PRODUCT_STARTER }}
          STRIPE_PLAN_PRODUCT_GROWTH: ${{ vars.STRIPE_PLAN_PRODUCT_GROWTH }}
          STRIPE_PLAN_PRODUCT_SCALE: ${{ vars.STRIPE_PLAN_PRODUCT_SCALE }}
          STRIPE_PRICE_STARTER: ${{ vars.STRIPE_PRICE_STARTER }}
          STRIPE_PRICE_PRO: ${{ vars.STRIPE_PRICE_PRO }}
          STRIPE_PRICE_STUDIO: ${{ vars.STRIPE_PRICE_STUDIO }}
          TWILIO_SECONDARY_POLICY_SID: ${{ vars.TWILIO_SECONDARY_POLICY_SID }}
          TWILIO_A2P_POLICY_SID: ${{ vars.TWILIO_A2P_POLICY_SID }}
          INDEXNOW_KEY: ${{ vars.INDEXNOW_KEY }}
          RS_LIVE_IDS: ${{ vars.RS_LIVE_IDS }}
          STRIPE_SETUP: ${{ vars.STRIPE_SETUP || '1' }}
          RS_OWNER_INVITES: ${{ secrets.RS_OWNER_INVITES }}
          RS_MARKUP: ${{ vars.RS_MARKUP }}
          RS_STARTER_CREDITS: ${{ vars.RS_STARTER_CREDITS }}
          SIGNUP_CREDITS_ADS: ${{ vars.SIGNUP_CREDITS_ADS }}
          SIGNUP_CREDITS_ADS_PER_DAY: ${{ vars.SIGNUP_CREDITS_ADS_PER_DAY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_WEBHOOK_SECRET: ${{ secrets.RESEND_WEBHOOK_SECRET }}
          RS_MAIL_DOMAIN: ${{ vars.RS_MAIL_DOMAIN }}
          RS_POSTAL_ADDRESS: ${{ vars.RS_POSTAL_ADDRESS }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID || secrets.TWILIO_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PRIMARY_PROFILE_SID: ${{ vars.TWILIO_PRIMARY_PROFILE_SID }}
          TWILIO_NOTIFY_EMAIL: ${{ vars.TWILIO_NOTIFY_EMAIL }}
          RS_HD_MARKUP: ${{ vars.RS_HD_MARKUP }}
          RS_VIDEO_UPSCALE_MODEL: ${{ vars.RS_VIDEO_UPSCALE_MODEL }}
          RS_VIDEO_UPSCALE_USD_PER_SECOND: ${{ vars.RS_VIDEO_UPSCALE_USD_PER_SECOND }}
          RS_FREE_PREVIEW: ${{ vars.RS_FREE_PREVIEW }}
          RS_FREE_PREVIEWS_PER_DAY: ${{ vars.RS_FREE_PREVIEWS_PER_DAY }}
          RS_EMAIL_VERIFY: ${{ vars.RS_EMAIL_VERIFY }}
          RS_ACCOUNT_MAIL_FROM: ${{ vars.RS_ACCOUNT_MAIL_FROM }}
          RS_OUTREACH_FROM: ${{ vars.RS_OUTREACH_FROM }}
          FIRST_RUN_NUDGES: ${{ vars.FIRST_RUN_NUDGES }}
          EMAIL_DAILY_LIMIT: ${{ vars.EMAIL_DAILY_LIMIT }}
          EMAIL_TRANSACTIONAL_RESERVE: ${{ vars.EMAIL_TRANSACTIONAL_RESERVE }}
          EMAIL_NURTURE_DAILY_MAX: ${{ vars.EMAIL_NURTURE_DAILY_MAX }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GADS_SIGNUP_LABEL: ${{ vars.GADS_SIGNUP_LABEL || 'vf0bCP_Xja8dEIK1gYpF' }}
          GADS_PURCHASE_LABEL: ${{ vars.GADS_PURCHASE_LABEL || 'RzDtCPzXja8dEIK1gYpF' }}
          GADS_TAG_ID: ${{ vars.GADS_TAG_ID }}
          META_PIXEL_ID: ${{ vars.META_PIXEL_ID || '1420967503351211' }}
          TIKTOK_PIXEL_ID: ${{ vars.TIKTOK_PIXEL_ID || 'DBJ3O4JC77U38B7LS1FG' }}
          REDDIT_PIXEL_ID: ${{ vars.REDDIT_PIXEL_ID }}
          X_PIXEL_ID: ${{ vars.X_PIXEL_ID }}
          X_EVENT_SIGNUP: ${{ vars.X_EVENT_SIGNUP }}
          X_EVENT_PURCHASE: ${{ vars.X_EVENT_PURCHASE }}
          X_EVENT_VIEWCONTENT: ${{ vars.X_EVENT_VIEWCONTENT }}
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
          TIKTOK_EVENTS_TOKEN: ${{ secrets.TIKTOK_EVENTS_TOKEN }}
          REDDIT_CAPI_TOKEN: ${{ secrets.REDDIT_CAPI_TOKEN }}
          META_TEST_EVENT_CODE: ${{ vars.META_TEST_EVENT_CODE }}
          TIKTOK_TEST_EVENT_CODE: ${{ vars.TIKTOK_TEST_EVENT_CODE }}
          POOLS_PARTNER_SECRET: ${{ secrets.POOLS_PARTNER_SECRET }}
          CREATOR_POOLS: ${{ vars.CREATOR_POOLS || 'off' }}
          CREATOR_POOL_FEE_USD: ${{ vars.CREATOR_POOL_FEE_USD }}
          CREATOR_POOL_MIN_USD: ${{ vars.CREATOR_POOL_MIN_USD }}
          CREATOR_POOL_MAX_USD: ${{ vars.CREATOR_POOL_MAX_USD }}
          CROWDCUT_URL: ${{ vars.CROWDCUT_URL }}
          # MCP server for Claude and other MCP clients (mcpserver.py): on | off (default off).
          MCP_SERVER: ${{ vars.MCP_SERVER }}
          MCP_ALLOWED_ORIGINS: ${{ vars.MCP_ALLOWED_ORIGINS }}
          # Operator alerts (alerts.py): where they're emailed. Set as a repo variable or secret.
          OPS_ALERT_EMAIL: ${{ secrets.OPS_ALERT_EMAIL || vars.OPS_ALERT_EMAIL }}
          # Off-site backups (backup.py): Cloudflare R2 through rclone crypt. All six, or backups stay off.
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          BACKUP_CRYPT_PASSWORD: ${{ secrets.BACKUP_CRYPT_PASSWORD }}
          BACKUP_CRYPT_SALT: ${{ secrets.BACKUP_CRYPT_SALT }}
          # Connected ad accounts (adplatforms/): off until AD_LAUNCH is set.
          AD_LAUNCH: ${{ vars.AD_LAUNCH }}
          AD_LAUNCH_WORKSPACES: ${{ vars.AD_LAUNCH_WORKSPACES }}
          AD_RATE_TIER: ${{ vars.AD_RATE_TIER }}
          META_APP_ID: ${{ secrets.META_APP_ID || vars.META_APP_ID }}
