<!doctype html>
<html lang="en"{% if ui_v2 %} data-ui="v2" data-surface="public"{% endif %}>
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}{{ c.name }}{% endblock %}</title><meta name="robots" content="noindex">
<link rel="preload" as="font" type="font/woff2" href="{{ url_for('static', filename='fonts/inter-latin.woff2') }}" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', filename='fonts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">{% if ui_v2 %}<link rel="stylesheet" href="{{ url_for('static', filename='ui_v2.css') }}">{% endif %}</head>
<body class="cm">
<header class="cm-top"><div class="cm-wrap cm-top-in">
  <a class="cm-name" href="{{ url_for('community.home', slug=c.slug) }}">{{ c.name }}</a>
  {% if me %}<div class="row"><span class="small muted">{{ me.name or me.email }}{% if is_admin %} · {{ me.role }}{% endif %}</span>
    {% if not me.user_id %}<form method="post" action="{{ url_for('community.logout', slug=c.slug) }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="btn dark sm">Log out</button></form>{% else %}<a class="btn dark sm" href="{{ url_for('community.admin') }}">Manage</a>{% endif %}</div>{% endif %}
</div></header>
<main class="cm-wrap cm-main">
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block main %}{% endblock %}
</main>
<footer class="cm-wrap small dim cm-foot">Made with <a href="https://campaignify.ai/" rel="noopener">Campaignify</a></footer>
</body></html>
