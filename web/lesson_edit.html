{% extends "base.html" %}{% block title %}{{ ls.title }} · Lesson · Campaignify{% endblock %}
{% block body %}
<div class="page full">
  <p style="margin:0 0 14px"><a href="{{ url_for('community.course_edit', cid=ls.course_id) }}">← Course</a></p>
  <p class="eyebrow">Lesson</p><h1>{{ ls.title }}</h1>
  <form method="post" class="panel copyform"><input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="t">Title</label><input id="t" type="text" name="title" maxlength="120" value="{{ ls.title }}">
    <label for="b">Lesson text <span class="dim">(blank line between paragraphs)</span></label><textarea id="b" name="body" maxlength="20000" style="min-height:240px">{{ ls.body or '' }}</textarea>
    <label for="e">Video link <span class="dim">(YouTube, Vimeo or Loom)</span></label><input id="e" type="text" name="embed_url" maxlength="500" value="{{ ls.embed_url or '' }}" placeholder="https://">
    <label>Or a video or image from your library</label>
    <div class="medpick"><label class="medopt none"><input type="radio" name="media_id" value="" {{ 'checked' if not ls.media_id }}><span>None</span></label>
      {% for o in lib %}<label class="medopt"><input type="radio" name="media_id" value="{{ o.id }}" {{ 'checked' if ls.media_id == o.id }}>{% if o.kind == 'video' %}<img src="{{ url_for('media', oid=o.id, poster=1) }}" alt="Video {{ o.id }}" loading="lazy"><em>Video</em>{% else %}<img src="{{ url_for('media', oid=o.id) }}" alt="Image {{ o.id }}" loading="lazy">{% endif %}</label>{% endfor %}</div>
    <div class="go"><button class="btn dark sm" name="action" value="delete" data-confirm="Delete this lesson?">Delete lesson</button><button class="btn" name="action" value="save">Save lesson</button></div>
  </form>
</div>
{% endblock %}
