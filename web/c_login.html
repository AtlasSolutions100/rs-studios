{% extends "c_base.html" %}{% block title %}Log in · {{ c.name }}{% endblock %}{% block main %}
<form method="post" class="panel copyform cm-narrow"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><h2>Log in to {{ c.name }}</h2>
  <label for="e">Email</label><input id="e" type="email" name="email" required autocomplete="email">
  <label for="p">Password</label><input id="p" type="password" name="password" required autocomplete="current-password">
  <p style="margin-top:20px"><button class="btn" style="width:100%">Log in</button></p></form>
{% endblock %}
