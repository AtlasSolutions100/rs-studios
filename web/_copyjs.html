<script>
document.addEventListener('click', function(e){
  var b = e.target.closest('[data-copy]'); if(!b) return;
  var el = document.getElementById(b.dataset.copy); if(!el) return;
  var t = el.innerText; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function(){ b.textContent = 'Copied'; setTimeout(function(){ b.textContent = 'Copy'; }, 1400); }).catch(function(){
    var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); });
});
</script>
