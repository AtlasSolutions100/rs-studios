{# A refund or dispute put this workspace on a billing hold (billing_holds.py). Needs hb (hold_banner) in scope. #}
<div class="vbanner hot" role="alert" data-hold-banner>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>
  <p>{{ hb.message }}</p>
  <a class="btn sm dark" href="mailto:{{ hb.email }}">Email us</a>
</div>
