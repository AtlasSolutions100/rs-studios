<!doctype html>
<html lang="en" class="pp pp-light">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ fm.name }}</title>
<meta name="robots" content="noindex">
<link rel="preload" as="font" type="font/woff2" href="{{ url_for('static', filename='fonts/inter-latin.woff2') }}" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', filename='fonts.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='page.css') }}"><style>:root{--pp-accent:#BDFA25}</style></head>
<body><main class="pp-sec" style="border:0"><div class="pp-wrap pp-center">
  <h1 style="font-size:36px">{{ fm.name }}</h1>
  {% if sent %}<div class="pp-ok">{{ fm.success_message or 'Thanks! We got it.' }}</div>
  {% else %}
  {% for e in errors %}<p class="pp-note" style="color:#C0392B;font-weight:600">{{ e }}</p>{% endfor %}
  {% include "_form_fields.html" %}
  {% endif %}
</div></main>
<footer class="pp-foot"><div class="pp-wrap">Made with <a href="https://campaignify.ai/" rel="noopener">Campaignify</a></div></footer>
{% include "_page_tracking.html" %}</body></html>
