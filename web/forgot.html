{% extends "auth_base.html" %}{% block title %}Reset your password · Campaignify{% endblock %}
{% block auth %}
  <h2>Reset your password</h2>
  <p class="muted">Enter the email you log in with. We'll send a link to set a new password.</p>
  <form method="post" action="{{ url_for('logins.forgot') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="email">Email</label><input id="email" type="email" name="email" required autocomplete="email" value="{{ email or '' }}">
    <p style="margin-top:22px"><button class="btn" style="width:100%">Send the link</button></p>
  </form>
  <p class="small muted">Remembered it? <a href="{{ url_for('login') }}">Log in</a>.</p>
{% endblock %}
