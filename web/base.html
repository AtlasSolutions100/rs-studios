<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}RS Studios{% endblock %}</title>
<link rel="icon" href="{{ url_for('static', filename='img/lion-badge-128.png') }}">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
{% block shell %}
<div class="shell">
  <aside class="side">
    <a class="logo" href="{{ url_for('studio') }}"><img src="{{ url_for('static', filename='img/lion.svg') }}" alt=""><div><b>RS Studios</b><span>Ad creation studio</span></div></a>
    <a class="nav {{ 'on' if request.endpoint in ('studio','new') }}" href="{{ url_for('studio') }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5L18 18M6 18l2.5-2.5M15.5 8.5L18 6"/></svg><span>Create</span></a>
    <a class="nav {{ 'on' if request.endpoint=='library' }}" href="{{ url_for('library') }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg><span>Library</span></a>
    <a class="nav {{ 'on' if request.endpoint=='brand_kit' }}" href="{{ url_for('brand_kit') }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3a9 9 0 100 18c1 0 1.5-.8 1.5-1.6 0-1-.8-1.4-.8-2.4 0-1 .8-1.6 1.8-1.6H17a4 4 0 004-4c0-4.4-4-8.4-9-8.4z"/><circle cx="7.5" cy="11" r="1.2" fill="currentColor"/><circle cx="10.5" cy="7" r="1.2" fill="currentColor"/><circle cx="15" cy="7.5" r="1.2" fill="currentColor"/></svg><span>Brand kit</span></a>
    {% if g.user.is_admin %}<a class="nav {{ 'on' if request.endpoint=='admin' }}" href="{{ url_for('admin') }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>Admin</span></a>{% endif %}
    <div class="grow"></div>
    <a class="pill" href="{{ url_for('library') }}" title="Credits left"><i></i>{{ '{:,}'.format(g.ws.credits) }} credits</a>
    <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="linkbtn">Log out</button></form>
    <div class="tag">BETTER ADS.<br>FASTER.</div>
  </aside>
  <div>
    {% for m in get_flashed_messages() %}<div class="flash" style="margin:20px 32px 0">{{ m }}</div>{% endfor %}
    {% block body %}{% endblock %}
  </div>
</div>
{% endblock %}
<script>
// Template and library thumbnails: play muted previews on hover.
document.querySelectorAll('[data-hoverplay]').forEach(function(el){
  var v = el.querySelector('video'); if(!v) return;
  el.addEventListener('mouseenter', function(){ v.play().catch(function(){}); });
  el.addEventListener('mouseleave', function(){ v.pause(); });
});
</script>
</body>
</html>
