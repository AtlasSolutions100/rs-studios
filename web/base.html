<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}RS Studios{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top"><div class="in">
  <a class="brand" href="{{ url_for('index') }}"><span class="mark">RS</span>RS <b>Studios</b></a>
  {% if g.user %}
  <nav class="nav">
    <a href="{{ url_for('studio') }}" class="{{ 'on' if request.endpoint in ('studio','new') }}">Create</a>
    <a href="{{ url_for('library') }}" class="{{ 'on' if request.endpoint=='library' }}">Library</a>
    <a href="{{ url_for('brand_kit') }}" class="{{ 'on' if request.endpoint=='brand_kit' }}">Brand kit</a>
    {% if g.user.is_admin %}<a href="{{ url_for('admin') }}" class="{{ 'on' if request.endpoint=='admin' }}">Admin</a>{% endif %}
  </nav>
  <span class="credits">{{ g.ws.credits }} credits</span>
  <form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ csrf_token() }}"><button class="linkbtn">Log out</button></form>
  {% endif %}
</div></header>
<main>
  {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
  {% block body %}{% endblock %}
</main>
</body>
</html>
