<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
<meta name="referrer" content="no-referrer">
<title>{{ name or 'Ad preview' }}</title>
<style>
  :root { --bg: #f6f5f2; --fg: #16151a; --muted: #6b6870; --line: #e3e1dc; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111014; --fg: #f1efe9; --muted: #a29fa8; --line: #2a2830; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 24px 16px; }
  .ad { max-width: min(560px, 100%); max-height: 78vh; width: auto; height: auto; display: block;
    border-radius: 12px; border: 1px solid var(--line); background: #000; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0; text-align: center; }
  footer { font-size: .8rem; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<main>
  {% if o.kind == 'video' %}
  <video class="ad" src="{{ url_for('share.media', token=token) }}" poster="{{ url_for('share.media', token=token, poster=1) }}" controls playsinline loop muted></video>
  {% else %}
  <img class="ad" src="{{ url_for('share.media', token=token) }}" alt="{{ name or 'Ad' }}">
  {% endif %}
  {% if name %}<h1>{{ name }}</h1>{% endif %}
  <footer><a href="{{ url_for('index') }}" rel="nofollow">Made with Campaignify</a></footer>
</main>
</body>
</html>
