{% extends "auth_base.html" %}{% block title %}Log in · Campaignify{% endblock %}
{% block auth %}
  <h2>Log in to Campaignify</h2>
  <p class="muted">As {{ email }}.{% if signed_in %} This logs you out of the account you're in now.{% endif %} The link works once.</p>
  <form method="post" action="{{ url_for('logins.magic_login') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <p style="margin-top:22px"><button class="btn" style="width:100%">Log in</button></p>
  </form>
  <p class="small muted">Not you? <a href="{{ url_for('login') }}">Log in another way</a>.</p>
{% endblock %}
