# Campaignify (repo rs-studios) runs on the Crowdcut server, behind Crowdcut's Caddy (which owns
# ports 80/443 and the certificates for campaignify.ai). The app
# joins Crowdcut's network so Caddy reaches it as rs-studios-app:8080.
#
# Deploys: every push to main (see .github/workflows/deploy.yml) sends this
# repo and the settings from GitHub secrets to the server's deploy hook
# (clipforgd deploy/deployer/deployer.py). The hook builds rs-studios-app:next,
# starts it as a side container and waits for /health, and only then keeps the
# running image as rs-studios-app:prev, tags the new one :latest, writes
# /opt/rs-studios and runs `docker compose -p rs-studios up -d --no-build`.
# A release that is unhealthy after the switch goes back to :prev on its own;
# the "Roll back Campaignify" workflow (rollback.yml) does it by hand.
# Settings live in settings.txt next to this file (never committed).
#
# Two services, one image (roadmap M7.2): "app" serves requests only; "worker" runs the background loop
# (generation jobs, flows, sends, conversions, alerts, backups, launches, insights, plan sync, nudges) and the
# planning and research runs the web queues (tasks.py). RS_WORKER_MODE=process on both says so. The deploy hook's
# `up -d --no-build --force-recreate` recreates both from :latest, and a rollback (which retags :prev as :latest)
# brings both back. The worker starts after the app (depends_on), so the old release's loop has stopped first.
# The app's /health answers ok only once the worker of the same image beats (BUILD_ID), so the hook's check
# after the switch rolls back a release whose worker never comes up.
# Kill switch: RS_WORKER_PROCESS=off in settings.txt puts the loop back in the app as a thread; the worker idles.
# An image from before M7.2 (after a rollback) has no worker_main.py: its app runs the thread as it always did
# and the worker container only sleeps, so nothing runs twice.
services:
  app:
    build: .
    # the tag the deploy hook manages (:latest runs, :prev is the one before)
    image: rs-studios-app:latest
    container_name: rs-studios-app
    restart: unless-stopped
    env_file: [settings.txt]
    environment:
      - RS_COOKIE_SECURE=1
      - RS_WORKER_MODE=process
    volumes:
      - ./data:/srv/rs/data
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    image: rs-studios-app:latest
    container_name: rs-studios-worker
    restart: unless-stopped
    env_file: [settings.txt]
    environment:
      - RS_WORKER_MODE=process
      - RS_PROC_ROLE=worker
    depends_on: [app]
    command: ["sh", "-c", "if [ -f worker_main.py ]; then exec python worker_main.py; else echo 'this image has no worker process; its app runs the loop'; exec sleep infinity; fi"]
    volumes:
      - ./data:/srv/rs/data
    # a pass, then the running AI runs (RS_WORKER_STOP_S, 40 s), then exit
    stop_grace_period: 60s
    healthcheck:
      test: ["CMD", "sh", "-c", "[ ! -f worker_main.py ] || python worker_main.py --check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  default:
    name: crowdcut_default
    external: true
